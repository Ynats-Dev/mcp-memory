{% extends "espace.html" %}
{% block onglet %}
<section class="carte">
  <h2>Jeton d'accès</h2>
  <p>La valeur de <code>MCP_TOKEN</code> (fichier <code>.env</code> du serveur). Elle est enregistrée
     <strong>dans ce navigateur uniquement</strong>, jamais sur le serveur, et préremplit les configurations des autres
     onglets.</p>
  <form class="formulaire" id="form-jeton" autocomplete="off">
    <label>Jeton
      <span class="champ-jeton">
        <input type="password" id="jeton" spellcheck="false" placeholder="Coller ici le MCP_TOKEN">
        <button type="button" id="jeton-voir" title="Afficher / masquer" aria-label="Afficher ou masquer le jeton">
          <svg viewBox="0 0 24 24" class="ic"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg></button>
      </span></label>
    <div class="actions">
      <button type="submit" class="primaire">Enregistrer</button>
      <button type="button" id="jeton-verifier">Vérifier</button>
      <button type="button" id="jeton-oublier" class="lien">Oublier</button>
      <span id="jeton-etat" class="note" role="status"></span>
    </div>
  </form>
</section>
{% include "_jeton_script.html" %}
{% endblock %}
