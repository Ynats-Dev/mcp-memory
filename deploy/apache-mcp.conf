# Extrait d'un vhost HTTPS Apache (ex. mcp.example.com) — à adapter : remplacer IP_DU_SERVEUR.
# Public : uniquement le endpoint MCP et le parcours OAuth (claude.ai doit les joindre).
# LAN/VPN : tout le reste, c.-à-d. l'interface web.
# Modules : proxy, proxy_http, headers.

ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"

# Serveur MCP (8765) : endpoint + OAuth. Doit précéder la règle « / ».
ProxyPassMatch "^/(mcp|authorize|token|register|revoke|oauth/connexion|\.well-known/oauth-authorization-server|\.well-known/oauth-protected-resource/mcp)$" "http://IP_DU_SERVEUR:8765/$1"

# Interface web (8766)
ProxyPass        "/" "http://IP_DU_SERVEUR:8766/"
ProxyPassReverse "/" "http://IP_DU_SERVEUR:8766/"

<Location "/">
    # Restriction LAN existante (adapter le chemin)
    Include /etc/apache2/lan-only.conf
</Location>

<LocationMatch "^/(mcp|authorize|token|register|revoke|oauth/connexion|\.well-known/oauth-authorization-server|\.well-known/oauth-protected-resource/mcp)$">
    # Public : protégé par OAuth (mot de passe) ou par le jeton MCP_TOKEN
    Require all granted
</LocationMatch>
